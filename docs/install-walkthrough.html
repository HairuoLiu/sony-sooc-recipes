<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sony SOOC Recipes — Install walkthrough</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1d1d1f; --muted:#6b7280;
    --line:#e6e8eb; --accent:#0a84ff; --accent-soft:#e8f1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 56px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:.2px;}
  .sub{color:var(--muted);font-size:14px;margin:0;}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);}
  .lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
    padding:7px 14px;cursor:pointer;transition:.15s;}
  .lang button.active{background:var(--accent);color:#fff;font-weight:600;}

  .stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;display:flex;align-items:center;justify-content:center;min-height:340px;}
  .stage img{max-width:100%;max-height:62vh;width:auto;height:auto;object-fit:contain;border-radius:8px;
    display:block;user-select:none;-webkit-user-drag:none;}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);font-size:20px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.15s;}
  .nav:hover{background:#fff;border-color:var(--accent);color:var(--accent);}
  .nav.prev{left:10px}.nav.next{right:10px}
  .nav:disabled{opacity:.35;cursor:default;}

  .dots{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;}
  .dot{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0;transition:.15s;}
  .dot.active{background:var(--accent);transform:scale(1.25);}
  .counter{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;}

  .caption{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    min-height:120px;max-height:230px;overflow-y:auto;}
  .caption h2{margin:0 0 8px;font-size:17px;}
  .caption p{margin:0;color:#374151;font-size:14.5px;line-height:1.6;}
  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;}
  .hint kbd{background:#eef0f3;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-family:inherit;font-size:12px;}
  .caption::-webkit-scrollbar{width:8px}
  .caption::-webkit-scrollbar-thumb{background:#d6dae0;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Install walkthrough</h1>
      <p class="sub" id="subtitle">Flip through the three steps from the .exe to a camera full of looks.</p>
    </div>
    <div class="lang" role="group" aria-label="language">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="zh">中文</button>
    </div>
  </header>

  <div class="stage">
    <button class="nav prev" id="prev" aria-label="previous">‹</button>
    <img id="shot" src="" alt="">
    <button class="nav next" id="next" aria-label="next">›</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="counter" id="counter"></div>

  <div class="caption">
    <h2 id="capTitle"></h2>
    <p id="capBody"></p>
  </div>

  <p class="hint">← <kbd>←</kbd> <kbd>→</kbd> → &nbsp;·&nbsp; swipe on touch &nbsp;·&nbsp; or use the arrows</p>
</div>

<script>
const DATA = {
  en: {
    dir: "assets/install/en",
    title: "Install walkthrough",
    subtitle: "Flip through the three steps from the .exe to a camera full of looks.",
    steps: [
      { img: "01-connect-camera.png", t: "1 · Connect your camera",
        b: "Plug the prepared camera into USB and set it to Mass Storage. The installer finds it on its own and the step turns green. If it doesn't, press Detect Again — the checklist is in the docs." },
      { img: "02-choose-packs.png", t: "2 · Choose your packs",
        b: "Every pack the installer carries is ticked by default. Untick what you don't want; the Select All box at the top right clears or restores all of them at once. Base carries 6 packs / 91 looks." },
      { img: "03-installing.png", t: "3 · Install in one click",
        b: "Press Install. A single progress bar counts down what's left — about ten minutes. You can minimise the window while it works. When it finishes, unplug, power-cycle the camera, and shoot." }
    ]
  },
  zh: {
    dir: "assets/install/zh-CN",
    title: "安装过程演示",
    subtitle: "从 .exe 到一机器观感，就这三屏，左右翻着看。",
    steps: [
      { img: "01-connect-camera.png", t: "第 1 步 · 连接相机",
        b: "用 USB 连上准备好的相机，并设为 Mass Storage（大容量存储）模式。安装器会自动识别，这一步变绿；没识别到就按「重新检测」，排查清单在文档里。" },
      { img: "02-choose-packs.png", t: "第 2 步 · 选择配方包",
        b: "安装器自带的包默认全部勾选。去掉不想要的；右上角的「全选」框可以一键清空或恢复全部。Base 带 6 个包、91 款观感。" },
      { img: "03-installing.png", t: "第 3 步 · 一键安装",
        b: "点击「安装」。一条进度条显示剩余进度，大约十分钟。干活时窗口可以最小化。完成后拔线、关机再开机，就能开拍了。" }
    ]
  }
};

let lang = "en";
let idx = 0;

const $ = id => document.getElementById(id);
const shot = $("shot"), capTitle = $("capTitle"), capBody = $("capBody");
const counter = $("counter"), dots = $("dots"), prev = $("prev"), next = $("next");

function initDots(){
  dots.innerHTML = "";
  DATA[lang].steps.forEach((_, i) => {
    const d = document.createElement("button");
    d.className = "dot" + (i === idx ? " active" : "");
    d.setAttribute("aria-label", "step " + (i+1));
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
}
function render(){
  const s = DATA[lang].steps[idx];
  shot.src = DATA[lang].dir + "/" + s.img;
  shot.alt = s.t;
  capTitle.textContent = s.t;
  capBody.textContent = s.b;
  counter.textContent = (idx+1) + " / " + DATA[lang].steps.length;
  [...dots.children].forEach((d,i)=> d.classList.toggle("active", i===idx));
  prev.disabled = idx === 0;
  next.disabled = idx === DATA[lang].steps.length - 1;
  const cap = document.querySelector(".caption");
  if (cap) cap.scrollTop = 0;
}
function go(i){
  const n = DATA[lang].steps.length;
  idx = Math.max(0, Math.min(n-1, i));
  render();
}
function setLang(l){
  lang = l;
  idx = 0;
  document.documentElement.lang = (l === "zh") ? "zh-CN" : "en";
  document.title = (l === "zh") ? "索尼 SOOC 配方 — 安装演示" : "Sony SOOC Recipes — Install walkthrough";
  $("title").textContent = DATA[lang].title;
  $("subtitle").textContent = DATA[lang].subtitle;
  document.querySelectorAll(".lang button").forEach(b=> b.classList.toggle("active", b.dataset.lang===l));
  initDots();
  render();
}

prev.onclick = () => go(idx-1);
next.onclick = () => go(idx+1);
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(idx-1);
  if (e.key === "ArrowRight") go(idx+1);
});
// touch swipe
let sx = 0;
shot.addEventListener("touchstart", e => sx = e.changedTouches[0].clientX, {passive:true});
shot.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});

// initial language: ?lang=zh or opened from a zh-CN doc
const q = new URLSearchParams(location.search).get("lang");
const ref = (document.referrer || "").toLowerCase();
setLang((q === "zh" || q === "zh-CN" || ref.includes("zh-cn")) ? "zh" : "en");
</script>
</body>
</html>
