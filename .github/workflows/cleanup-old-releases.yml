name: cleanup-old-releases

# One-shot maintenance: delete the pre-rebrand releases (v0.2.0..v0.4.0) and their
# tags, so v0.5.0 is the project's first published version. Uses the workflow's own
# token. Removed again once it has run.

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: delete old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v0.2.0 v0.3.0 v0.4.0; do
            if gh release delete "$t" --yes --cleanup-tag 2>/dev/null; then
              echo "deleted release + tag: $t"
            else
              echo "no release for: $t (deleting tag only)"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" >/dev/null 2>&1 || echo "  tag $t already gone"
            fi
          done
          echo "--- remaining releases ---"
          gh release list || true
          echo "--- remaining tags ---"
          gh api "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' || true
