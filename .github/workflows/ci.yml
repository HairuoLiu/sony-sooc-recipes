name: catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-CN.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A branch pushed twice in quick succession should not keep two identical verification runs
# alive; the older one is answering a question nobody is asking any more. Unlike the release
# workflow, cancelling here is free — nothing has been published at this point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gate 1 — is the registry internally legal, and is its provenance honest?
      - name: validate catalog
        run: python tools/validate_catalog.py

      # Gate 1b — regression cases. Upstream recipes are locked by the fidelity
      #          check below; the ones this repository authors itself have no
      #          upstream to compare against, so tests/cases.json is their spec.
      - name: run catalog test cases
        run: python tests/test_catalog.py

      # The pack transform and the release matrix are only exercised on release tags
      # otherwise — a bug there would first surface as a failed release, which is the
      # worst possible time. test_gates.py is the self-test: it breaks one thing per
      # gate and asserts the gate actually fails, so a refactor that silently loosened
      # a gate cannot pass CI green.
      - name: run pack and gate self-tests
        run: |
          python tests/test_packs.py
          python tests/test_gates.py

      # Gate 2 — does the catalog still generate the same Java the fork ships?
      #          Fails if someone hand-edited Recipes.java or forgot to regenerate.
      - name: fetch upstream Recipes.java
        run: |
          mkdir -p build
          curl -sSL -o build/upstream-Recipes.java \
            https://raw.githubusercontent.com/voxivoid/recipe-lab-sony-pmca/development/src/com/voxivoid/recipelab/Recipes.java

      # Gate 3 — the important one. Every upstream recipe must still reproduce
      #          value for value. A silent drift here means the APK would shoot
      #          different colours than the project it claims to build on.
      - name: check recipe fidelity against upstream
        run: python tools/check_fidelity.py --upstream build/upstream-Recipes.java

      - name: generate Recipes.java
        run: python tools/gen_recipes.py --fork build/recipe-lab-sony-pmca

      - name: upload generated Recipes.java
        uses: actions/upload-artifact@v4
        with:
          name: Recipes.java
          path: build/recipe-lab-sony-pmca/src/com/hairuoliu/sonysoocrecipes/Recipes.java
          if-no-files-found: error

      # Gate 4 — the browser is one inline script; a typo ships a blank page and
      # nothing else would catch it.
      - name: regenerate browser and smoke-test it
        run: |
          python tools/gen_browser.py
          git diff --exit-code catalog/index.html \
            || { echo "catalog/index.html is stale — run python tools/gen_browser.py"; exit 1; }
          node tests/smoke_browser.js

  # A mismatch between the README's numbers and the catalog is a documentation bug
  # that reviewers never catch by eye. The README carries a machine-readable marker
  # rather than prose, because parsing a wrapped sentence breaks on any rewording.
  counts:
    name: README counts match the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check
        run: python tools/check_readme_counts.py

  # Gate 6 — a document pointing at a picture that is not there. Images live in
  #          docs/assets/ and are versioned alongside the prose, and nothing may be
  #          hotlinked, so a rename nobody noticed fails here instead of quietly
  #          rotting on GitHub. Status badges are the one exception: they are
  #          generated per request, and vendoring one would freeze a build status.
  assets:
    name: document images resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check
        run: python tools/check_assets.py

  # Gate 7 — the bilingual document set. Two English/zh-CN twins that silently drift apart
  # are worse than no translation at all: a reader following a stale Chinese page has no way
  # to know it describes an older version. This gate cannot judge whether a translation is
  # *faithful*, so it does not pretend to. It enforces the mechanical parts that are
  # checkable: every English document is either twinned or explicitly declared English-only,
  # the shared diagrams carry no language-specific text, and the counts baked into those
  # diagrams still match the catalog.
  docs:
    name: bilingual docs are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check
        run: python tools/check_docs.py
