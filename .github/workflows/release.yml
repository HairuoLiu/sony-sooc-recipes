name: release

# Builds the APKs and attaches them to the GitHub Release.
#
# Why this exists rather than "run tools/build_apk.sh yourself": the toolchain is about
# 3 GB and needs NDK r16b — the last NDK that still ships the GCC toolchain an
# Android 2.3.7 / API 10 target requires. Nobody should install that to try a recipe.
# Push a tag, get an APK.
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# Or re-run for a tag that already exists: Actions -> release -> Run workflow.
#
# Why a matrix: there is one all-in-one app plus one APK per brand pack (8 of them today),
# and each matrix job is an independent runner. Two reasons drive the split:
#   1. Diagnosis. With fail-fast: false one broken pack does not abort the other jobs, so a
#      single run shows you the state of every target instead of stopping at the first
#      failure. It does NOT make the release partial: the publish job needs the whole matrix,
#      because a release that silently lacks a pack is worse than no release.
#   2. Cost. Every matrix job downloads its own ~3 GB toolchain. 9 targets today means
#      ~27 GB of downloads per release. That is the price of side-by-side brand packs;
#      keep it in mind before adding packs.
# The build matrix is DERIVED from catalog/packs.json at run time (see tools/build_matrix.py),
# so adding a pack there is picked up with no YAML edit. The pack list must never be copied
# into this file — that is exactly the drift this repo forbids.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true
        type: string

# Deny by default, then grant per job. Only `release` publishes, so only `release` gets a
# writable token. That matters here more than in a typical repo: the `apk` job executes the
# *upstream project's* build.sh, and a token that can push is a token that script could steal.
# Narrowing it costs three lines and removes that class of escalation entirely.
permissions: {}

# Two tag pushes (or a tag push racing a manual dispatch) would otherwise start two full
# releases that both run `gh release create` for the same tag. cancel-in-progress is off:
# cancelling halfway through publishing is worse than queueing behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------
  # Derive the build matrix from catalog/packs.json and run the catalog gates. A second
  # literal copy of the pack list here would drift the moment someone edits packs.json,
  # so the matrix is computed, not written. Emits the matrix as JSON to $GITHUB_OUTPUT.
  targets:
    name: derive build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A catalog that fails its own gates should never reach the point of producing
      # something a human installs on a camera. test_catalog.py is here rather than only in
      # ci.yml because it also asserts that THIS file runs every build step build_apk.sh
      # does (TestBuildPipelinesAgree) — the check has to happen before the build, on the
      # tree being released, or it cannot stop a release that is missing a step.
      - name: catalog gates
        run: |
          python tools/validate_catalog.py
          python tests/test_catalog.py
          python tests/test_packs.py

      - name: build matrix
        # tools/build_matrix.py, not an inline `python -c`: inside a YAML block scalar the
        # code carries its indentation into the shell string, and `python -c` then dies on
        # the first statement with `IndentationError: unexpected indent` — before building
        # anything. The script also imports apply_pack.apk_name(), so the APK filename in
        # the matrix is the same rule that rewrites build.sh rather than a second copy of it.
        id: matrix
        run: |
          MATRIX="$(python tools/build_matrix.py)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "targets: all-in-one + $(python tools/build_matrix.py --ids | wc -l) brand pack(s)"
          python tools/build_matrix.py --ids

  # ------------------------------------------------------------------------------
  # One job per matrix entry: the all-in-one app, then one per brand pack. Each does the
  # current pipeline for its single target.
  apk:
    name: build ${{ matrix.id }}
    needs: targets
    runs-on: ubuntu-latest
    # Read-only: this job builds artifacts, it never publishes. It runs third-party build
    # scripts, so the token it can see must not be able to write to the repository.
    permissions:
      contents: read

    env:
      UPSTREAM_REPO: https://github.com/voxivoid/recipe-lab-sony-pmca.git
      # Pinned rather than "development" on purpose. An unpinned clone means the same
      # tag can produce a different APK next month, and the whole point of a tag is that
      # it does not. Bump this deliberately, in a commit, when upstream is re-validated.
      UPSTREAM_SHA: 6b5c8aa2900019d98496c7047a90ce73d2d6a725

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install build-tools 30.0.3, platform 28, NDK r16b
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch upstream at the pinned revision
        run: |
          git clone "$UPSTREAM_REPO" build/recipe-lab-sony-pmca
          cd build/recipe-lab-sony-pmca
          git checkout "$UPSTREAM_SHA"

          # jni/platform is required — Android.mk includes platform/vars.mk and compiles
          # its driver sources. It is upstream's only submodule (OpenMemories-Platform).
          #
          # It is cloned directly rather than with `git submodule update --init`, and
          # that is deliberate. OpenMemories-Platform carries a nested submodule pinned
          # to git.code.sf.net/p/stlport/code, which no longer resolves; git recurses
          # into it even without --recursive and aborts the whole job. The stlport this
          # build links against is the one NDK r16b ships (APP_STL := stlport_static in
          # jni/Application.mk) — the nested copy exists for the platform repo's own
          # builds, not ours. Do not "simplify" this back to a submodule update.
          PLATFORM_SHA="$(git rev-parse "$UPSTREAM_SHA:jni/platform")"
          echo "jni/platform pinned at $PLATFORM_SHA"
          rm -rf jni/platform
          git clone https://github.com/ma1co/OpenMemories-Platform.git jni/platform
          git -C jni/platform checkout "$PLATFORM_SHA"

      - name: rebrand fork to Sony SOOC Recipes
        # The upstream tree hard-codes its package, native library and product names well
        # beyond the Java sources: res/layout names custom views by fully-qualified class,
        # jni.cpp looks the exception class up by path, and build.sh / build.cmd name both the
        # .so and the output APK. Miss any one and the build dies, or the app crashes on launch.
        #
        # 'voxivoid' -> 'hairuoliu' in a single pass rewrites every separator form
        # (com.voxivoid.recipelab, com/voxivoid/recipelab, com\voxivoid\recipelab,
        # com_voxivoid_recipelab) without relying on sed backslash escaping, which silently
        # mis-handled the Windows form in build.cmd.
        run: |
          cd build/recipe-lab-sony-pmca
          pattern=(
            -e 's/voxivoid/hairuoliu/g'
            -e 's/Recipe Lab/Sony SOOC Recipes/g'
            -e 's/RecipeLab/SonySOOCRecipes/g'
            -e 's/recipelab/sonysoocrecipes/g'
          )
          find src jni res -type f \
            \( -name '*.java' -o -name '*.cpp' -o -name '*.c' -o -name '*.h' \
               -o -name '*.mk' -o -name '*.xml' \) -exec sed -i "${pattern[@]}" {} +
          sed -i "${pattern[@]}" AndroidManifest.xml build.sh build.cmd tools/check-version.sh
          mkdir -p src/com/hairuoliu
          git mv src/com/voxivoid/recipelab src/com/hairuoliu/sonysoocrecipes

      - name: apply pack transform
        # Only for brand packs. apply_pack.py rewrites the package name, the app name and
        # the icon set in place (it owns icon selection for packs, falling back to
        # assets/app-icon/ when assets/app-icon-packs/<icon_set>/ does not exist yet).
        # The all-in-one skips this and uses the explicit icon copy below instead.
        if: ${{ matrix.pack != '' }}
        run: |
          python tools/apply_pack.py --pack "${{ matrix.pack }}" --fork build/recipe-lab-sony-pmca

      - name: apply the app icon (all-in-one only)
        # The icon is a build input owned by this repository, not by the upstream checkout.
        # It lives in assets/app-icon/ and has to be copied in *after* the clone and after
        # the rebrand, because a fresh `git clone` in the previous step has no memory of it.
        # Everything is already RGBA with a transparent background, sized per density —
        # see assets/app-icon/README.md. Update the set with tools/build_app_icon.py.
        # Packs let apply_pack.py handle their icons, so this step is all-in-one only.
        if: ${{ matrix.pack == '' }}
        run: |
          F=build/recipe-lab-sony-pmca
          cp assets/app-icon/ic_launcher-mdpi.png    "$F/res/drawable-mdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-hdpi.png    "$F/res/drawable-hdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-xhdpi.png   "$F/res/drawable-xhdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-xxhdpi.png  "$F/res/drawable-xxhdpi/ic_launcher.png"
          cp assets/app-icon/icon-512.png            "$F/dist/icon-512.png"

      - name: apply the frosted two-bar UI theme
        # The main screen is a replayed patch, not committed source: build/ is gitignored
        # and this job starts from a fresh clone, so assets/ui/main.xml and
        # catalog/ui-theme.json are the only tracked copies of the UI and patch_ui.py is
        # the only thing that puts them into the checkout.
        #
        # It runs AFTER the pack transform because assets/ui/main.xml names the custom
        # views (HintBar / PickerView / PromptView) by fully-qualified class, and apply_pack
        # has just renamed that class for this pack. patch_ui fills the layout's
        # {ui_package} token from the checkout's OWN AndroidManifest.xml, so a brand pack
        # gets a layout pointing at the pack's classes. Run it before that rename and the
        # pack's APK inflates a layout naming a class it does not contain — a crash on
        # launch, with nothing in the build log to say which step caused it.
        #
        # Not optional, and it must stay in step with tools/build_apk.sh. It was missing
        # here for the v0.7.0 tag, so those ten APKs shipped upstream's main screen while
        # the CHANGELOG and both architecture documents said the frosted two-bar screen was
        # in them: the theme's own gate passed, because the tools worked — nothing tested
        # that this file ran them. tests/test_catalog.py::TestBuildPipelinesAgree now
        # compares the two pipelines, since a comment claiming they mirror each other is
        # not a test. That file runs in the `targets` job above, before anything is built.
        run: python tools/patch_ui.py --fork build/recipe-lab-sony-pmca

      - name: generate Recipes.java from the catalog
        # --pack narrows the catalog to that pack's groups; with no --pack the all-in-one.
        run: |
          if [ -n "${{ matrix.pack }}" ]; then
            python tools/gen_recipes.py --pack "${{ matrix.pack }}" --fork build/recipe-lab-sony-pmca
          else
            python tools/gen_recipes.py --fork build/recipe-lab-sony-pmca
          fi

      - name: build
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          cd build/recipe-lab-sony-pmca
          ./build.sh

      - name: collect
        # The output APK name is target-specific and comes from the matrix, which got it from
        # apply_pack.apk_name() — the same function that rewrites build.sh. Deriving it here
        # instead would be a second copy of the naming rule, and the two would drift.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          APK_NAME="${{ matrix.apk }}"
          ART="${APK_NAME%.apk}"
          SRC="build/recipe-lab-sony-pmca/$APK_NAME"
          test -f "$SRC" || { echo "no APK at $SRC"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/$ART-$TAG.apk"
          cd dist
          sha256sum "$ART-$TAG.apk" > "$ART-$TAG.apk.sha256"
          ls -l

      # Plain echo lines, not a heredoc: a heredoc inside a YAML block scalar is where
      # the quoting goes to die.
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            dist/*.apk
            dist/*.sha256

  # ------------------------------------------------------------------------------
  # Runs once: download every artifact into one directory and publish the release.
  release:
    name: publish release
    needs: [targets, apk]
    runs-on: ubuntu-latest
    # The only job that needs to write, and it does so in one step (`gh release`).
    permissions:
      contents: write

    env:
      UPSTREAM_REPO: https://github.com/voxivoid/recipe-lab-sony-pmca.git
      UPSTREAM_SHA: 6b5c8aa2900019d98496c7047a90ce73d2d6a725

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: release notes
        # English first. The audience that can find this repository at all is
        # English-dominant: it is a sideload for a camera platform whose tooling, forums and
        # documentation are English. A short Chinese summary stays at the end rather than
        # translating the whole note twice — the parts that must not be misread (exact
        # filenames, the sha256 commands) are language-neutral either way, and the four
        # caveats are the only prose a user has to act on.
        #
        # No backticks in the English prose below: these are double-quoted echo arguments,
        # and a backtick inside them would be command substitution, not formatting. No
        # recipe or group counts either — a number written here would silently rot the next
        # time the catalog changes.
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          N=dist/notes.md
          echo "Recipe tables from this repository, compiled into installable APKs: $TAG" > "$N"
          echo "" >> "$N"
          echo "**Install**: see docs/INSTALL.md. The first install goes over USB; do not use Wi-Fi ADB." >> "$N"
          echo "" >> "$N"
          echo "### Read these four before installing" >> "$N"
          echo "" >> "$N"
          echo "1. **The signing key is single-use.** With no keystore configured, every build" >> "$N"
          echo "   generates a fresh key. An APK signed with a different key **cannot overwrite**" >> "$N"
          echo "   an existing install — if your camera already has a Sony SOOC Recipes from" >> "$N"
          echo "   anywhere else, uninstall it first." >> "$N"
          echo "2. **Seven looks are not verified on hardware** (gr-moriyama, kodak-vision2-500t," >> "$N"
          echo "   Toy Camera warm/cold, Part Color red, Posterization, Teal Mood). Try those on" >> "$N"
          echo "   discardable footage before trusting them." >> "$N"
          echo "3. **The version shown inside the app is upstream's, not this tag.** Upstream reads" >> "$N"
          echo "   its version from AndroidManifest.xml; this repository only replaces the recipe" >> "$N"
          echo "   table. Trust the tag." >> "$N"
          echo "4. **Brand packs share the camera's settings store.** Installing several packs does" >> "$N"
          echo "   not give you several cameras — only one recipe can be active on the camera at a" >> "$N"
          echo "   time. Each pack carries its own recipe table under its own package name; they do" >> "$N"
          echo "   not stack." >> "$N"
          echo "" >> "$N"
          echo "### APKs in this release" >> "$N"
          echo "" >> "$N"
          echo "SonySOOCRecipes-$TAG.apk is the all-in-one app: every look in the catalog. Alongside" >> "$N"
          echo "it, one APK per camera brand. Each carries a distinct package name, so they install" >> "$N"
          echo "side by side:" >> "$N"
          echo "" >> "$N"
          # This glob cannot match the all-in-one artifact (SonySOOCRecipes-$TAG.apk): the
          # pattern needs a literal '-' before the tag, and after the first '-' the all-in-one
          # has 'v...', not '-'. Verified, not assumed — it is the reason the main app is
          # described on the line above and does not also appear in this list.
          for f in dist/SonySOOCRecipes-*-"$TAG".apk; do
            [ -e "$f" ] || continue
            base="$(basename "$f" "-$TAG.apk")"
            echo "- $base.apk — checksum in $base.apk.sha256" >> "$N"
          done
          echo "" >> "$N"
          echo "### Verify" >> "$N"
          echo "" >> "$N"
          echo '```' >> "$N"
          echo "sha256sum -c SonySOOCRecipes-$TAG.apk.sha256" >> "$N"
          for f in dist/SonySOOCRecipes-*-"$TAG".apk.sha256; do
            [ -e "$f" ] || continue
            echo "sha256sum -c $(basename "$f")" >> "$N"
          done
          echo '```' >> "$N"
          echo "" >> "$N"
          echo "Built from upstream $UPSTREAM_SHA" >> "$N"
          echo "" >> "$N"
          echo "---" >> "$N"
          echo "" >> "$N"
          echo "### 中文摘要" >> "$N"
          echo "" >> "$N"
          echo "本仓库的配方表，打成可安装的 APK。安装见 docs/INSTALL.md（第一次走 USB，别用 Wi-Fi ADB）。" >> "$N"
          echo "" >> "$N"
          echo "- **签名是一次性的**：不同 key 签的 APK 无法覆盖安装，相机上若已装过别处来的，先卸载。" >> "$N"
          echo "- **7 款配方未上机验证**（gr-moriyama、kodak-vision2-500t、Toy Camera 暖/冷、Part Color 红、Posterization、Teal Mood），先在可丢弃素材上试。" >> "$N"
          echo "- **App 内版本号是上游的**，不是这个 tag，以 tag 为准。" >> "$N"
          echo "- **品牌包共享相机设置存储**：装多个包不会得到多台相机，同一时间只有一个配方生效。" >> "$N"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --title "$TAG" --notes-file dist/notes.md
          fi
