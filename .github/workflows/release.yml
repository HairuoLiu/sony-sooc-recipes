name: release

# Builds the APK and attaches it to the GitHub Release.
#
# Why this exists rather than "run tools/build_apk.sh yourself": the toolchain is about
# 3 GB and needs NDK r16b — the last NDK that still ships the GCC toolchain an
# Android 2.3.7 / API 10 target requires. Nobody should install that to try a recipe.
# Push a tag, get an APK.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Or re-run for a tag that already exists: Actions -> release -> Run workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: build SonySOOCRecipes.apk
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: https://github.com/voxivoid/recipe-lab-sony-pmca.git
      # Pinned rather than "development" on purpose. An unpinned clone means the same
      # tag can produce a different APK next month, and the whole point of a tag is that
      # it does not. Bump this deliberately, in a commit, when upstream is re-validated.
      UPSTREAM_SHA: 6b5c8aa2900019d98496c7047a90ce73d2d6a725

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A catalog that fails its own gates should never reach the point of producing
      # something a human installs on a camera.
      - name: catalog gates
        run: |
          python tools/validate_catalog.py
          python tests/test_catalog.py

      - name: install build-tools 30.0.3, platform 28, NDK r16b
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch upstream at the pinned revision
        run: |
          git clone "$UPSTREAM_REPO" build/recipe-lab-sony-pmca
          cd build/recipe-lab-sony-pmca
          git checkout "$UPSTREAM_SHA"

          # jni/platform is required — Android.mk includes platform/vars.mk and compiles
          # its driver sources. It is upstream's only submodule (OpenMemories-Platform).
          #
          # It is cloned directly rather than with `git submodule update --init`, and
          # that is deliberate. OpenMemories-Platform carries a nested submodule pinned
          # to git.code.sf.net/p/stlport/code, which no longer resolves; git recurses
          # into it even without --recursive and aborts the whole job. The stlport this
          # build links against is the one NDK r16b ships (APP_STL := stlport_static in
          # jni/Application.mk) — the nested copy exists for the platform repo's own
          # builds, not ours. Do not "simplify" this back to a submodule update.
          PLATFORM_SHA="$(git rev-parse "$UPSTREAM_SHA:jni/platform")"
          echo "jni/platform pinned at $PLATFORM_SHA"
          rm -rf jni/platform
          git clone https://github.com/ma1co/OpenMemories-Platform.git jni/platform
          git -C jni/platform checkout "$PLATFORM_SHA"

      - name: rebrand fork to Sony SOOC Recipes
        # The upstream tree hard-codes its package, native library and product names well
        # beyond the Java sources: res/layout names custom views by fully-qualified class,
        # jni.cpp looks the exception class up by path, and build.sh / build.cmd name both the
        # .so and the output APK. Miss any one and the build dies, or the app crashes on launch.
        #
        # 'voxivoid' -> 'hairuoliu' in a single pass rewrites every separator form
        # (com.voxivoid.recipelab, com/voxivoid/recipelab, com\voxivoid\recipelab,
        # com_voxivoid_recipelab) without relying on sed backslash escaping, which silently
        # mis-handled the Windows form in build.cmd.
        run: |
          cd build/recipe-lab-sony-pmca
          pattern=(
            -e 's/voxivoid/hairuoliu/g'
            -e 's/Recipe Lab/Sony SOOC Recipes/g'
            -e 's/RecipeLab/SonySOOCRecipes/g'
            -e 's/recipelab/sonysoocrecipes/g'
          )
          find src jni res -type f \
            \( -name '*.java' -o -name '*.cpp' -o -name '*.c' -o -name '*.h' \
               -o -name '*.mk' -o -name '*.xml' \) -exec sed -i "${pattern[@]}" {} +
          sed -i "${pattern[@]}" AndroidManifest.xml build.sh build.cmd tools/check-version.sh
          mkdir -p src/com/hairuoliu
          git mv src/com/voxivoid/recipelab src/com/hairuoliu/sonysoocrecipes

      - name: apply the app icon
        # The icon is a build input owned by this repository, not by the upstream checkout.
        # It lives in assets/app-icon/ and has to be copied in *after* the clone and after
        # the rebrand, because a fresh `git clone` in the previous step has no memory of it.
        # Everything is already RGBA with a transparent background, sized per density —
        # see assets/app-icon/README.md. Update the set with tools/build_app_icon.py.
        run: |
          F=build/recipe-lab-sony-pmca
          cp assets/app-icon/ic_launcher-mdpi.png    "$F/res/drawable-mdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-hdpi.png    "$F/res/drawable-hdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-xhdpi.png   "$F/res/drawable-xhdpi/ic_launcher.png"
          cp assets/app-icon/ic_launcher-xxhdpi.png  "$F/res/drawable-xxhdpi/ic_launcher.png"
          cp assets/app-icon/icon-512.png            "$F/dist/icon-512.png"

      - name: generate Recipes.java from the catalog
        run: python tools/gen_recipes.py --fork build/recipe-lab-sony-pmca

      - name: build
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          cd build/recipe-lab-sony-pmca
          ./build.sh

      - name: collect
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          SRC="build/recipe-lab-sony-pmca/SonySOOCRecipes.apk"
          test -f "$SRC" || { echo "no APK at $SRC"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/SonySOOCRecipes-$TAG.apk"
          cd dist
          sha256sum "SonySOOCRecipes-$TAG.apk" > "SonySOOCRecipes-$TAG.apk.sha256"
          ls -l

      # Plain echo lines, not a heredoc: a heredoc inside a YAML block scalar is where
      # the quoting goes to die.
      - name: release notes
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          N=dist/notes.md
          echo "Sony SOOC Recipes 装的是本仓库的配方表：$TAG" > "$N"
          echo "" >> "$N"
          echo "**安装**: 见 docs/INSTALL.md（第一次走 USB，别用 Wi-Fi ADB）" >> "$N"
          echo "" >> "$N"
          echo "### 装之前先看这三条" >> "$N"
          echo "" >> "$N"
          echo "1. **签名是一次性的。** 没有配置 keystore 时，构建会临时生成一把 key。" >> "$N"
          echo "   用不同 key 签的 APK **无法覆盖安装**——如果相机上已经装过别处来的" >> "$N"
          echo "   SonySOOCRecipes，得先卸载再装。" >> "$N"
          echo "2. **有 7 款配方没上机验证过**（gr-moriyama、kodak-vision2-500t、" >> "$N"
          echo "   Toy Camera 暖/冷、Part Color 红、Posterization、Teal Mood）。" >> "$N"
          echo "   先在可丢弃的素材上试。" >> "$N"
          echo "3. **APK 里显示的版本号是上游的，不是这个 tag。** 上游从" >> "$N"
          echo "   AndroidManifest.xml 取版本，本仓库只换配方表。以 tag 为准。" >> "$N"
          echo "" >> "$N"
          echo "### 校验" >> "$N"
          echo "" >> "$N"
          echo '```' >> "$N"
          echo "sha256sum -c SonySOOCRecipes-$TAG.apk.sha256" >> "$N"
          echo '```' >> "$N"
          echo "" >> "$N"
          echo "构建自上游 $UPSTREAM_SHA" >> "$N"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --title "$TAG" --notes-file dist/notes.md
          fi
